<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Clone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f0f1a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Arial Black', Arial, sans-serif; overflow: hidden; }
        canvas { display: block; cursor: crosshair; }

        /* ---- SCREENS ---- */
        .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(160deg,#0f0f1a,#1a1a3a); }
        .screen.hidden { display: none; }

        /* --- MAIN MENU --- */
        #menuScreen h1 { font-size: 52px; color: #f7c948; text-shadow: 0 0 30px #f7c948, 0 0 60px #f39c12; letter-spacing: 4px; margin-bottom: 8px; }
        #menuScreen p  { color: #aaa; margin-bottom: 36px; font-size: 15px; }
        #menuScreen button { padding: 16px 52px; font-size: 22px; background: linear-gradient(135deg,#f7c948,#e67e22); border: none; border-radius: 40px; color: #111; font-family: inherit; font-weight: 900; cursor: pointer; box-shadow: 0 6px 24px rgba(247,201,72,.45); transition: transform .12s; }
        #menuScreen button:hover { transform: scale(1.07); }

        /* --- BRAWLER SELECT --- */
        #selectScreen h2 { font-size: 30px; color: #f7c948; margin-bottom: 24px; letter-spacing: 2px; }
        #brawlerGrid { display: grid; grid-template-columns: repeat(3, 160px); gap: 16px; margin-bottom: 28px; }
        .brawler-card { background: #1e1e3a; border: 3px solid #333; border-radius: 16px; padding: 18px 12px; text-align: center; cursor: pointer; transition: all .15s; position: relative; overflow: hidden; }
        .brawler-card:hover { border-color: #f7c948; transform: scale(1.04); }
        .brawler-card.selected { border-color: #f7c948; background: #2a2a4a; box-shadow: 0 0 20px rgba(247,201,72,.4); }
        .brawler-card .brawler-icon { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
        .brawler-card h3 { font-size: 15px; color: #fff; margin-bottom: 4px; }
        .brawler-card .brawler-desc { font-size: 11px; color: #888; line-height: 1.4; }
        .brawler-card .brawler-class { font-size: 10px; font-weight: bold; margin-bottom: 6px; padding: 2px 8px; border-radius: 10px; display: inline-block; }
        .stat-row { display: flex; gap: 6px; margin-top: 6px; justify-content: center; }
        .stat-bar { height: 4px; width: 10px; border-radius: 2px; background: #444; }
        .stat-bar.filled { background: #f7c948; }
        #startBtn { padding: 14px 44px; font-size: 18px; background: linear-gradient(135deg,#2ecc71,#27ae60); border: none; border-radius: 30px; color: #fff; font-family: inherit; font-weight: 900; cursor: pointer; box-shadow: 0 4px 18px rgba(46,204,113,.4); transition: transform .12s; }
        #startBtn:hover { transform: scale(1.06); }

        /* --- IN-GAME HUD --- */
        #hud { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 700px; padding: 8px 16px; display: flex; align-items: center; gap: 14px; pointer-events: none; }
        .hud-left { display: flex; flex-direction: column; gap: 5px; flex: 1; }
        .bar-row { display: flex; align-items: center; gap: 8px; }
        .bar-label { color: #ccc; font-size: 11px; width: 44px; }
        .bar-track { flex: 1; height: 10px; background: #333; border-radius: 5px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 5px; transition: width .1s; }
        #hp-fill   { background: linear-gradient(90deg,#e74c3c,#ff6b6b); }
        #ammo-fill { background: linear-gradient(90deg,#3498db,#74b9ff); }
        #super-fill { background: linear-gradient(90deg,#f7c948,#e67e22); }
        .hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        #hud-kills  { color: #f7c948; font-size: 16px; font-weight: 900; }
        #hud-wave   { color: #aaa; font-size: 12px; }
        #super-btn-hint { font-size: 11px; color: #f7c948; }
        #hud.hidden { display: none; }

        /* --- OVERLAY --- */
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.78); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
        #overlay.hidden { display: none; }
        #overlay h1 { font-size: 54px; margin-bottom: 16px; }
        #overlay .sub { font-size: 18px; color: #ccc; margin-bottom: 10px; }
        #overlay .score { font-size: 24px; color: #f7c948; margin-bottom: 30px; }
        #overlay button { padding: 14px 42px; font-size: 18px; background: linear-gradient(135deg,#f7c948,#e67e22); border: none; border-radius: 30px; color: #111; font-family: inherit; font-weight: 900; cursor: pointer; margin: 6px; box-shadow: 0 4px 18px rgba(247,201,72,.4); transition: transform .12s; }
        #overlay button:hover { transform: scale(1.06); }

        /* controls hint */
        #controls-hint { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); color: #555; font-size: 11px; pointer-events: none; }
    </style>
</head>
<body>

<!-- MAIN MENU -->
<div class="screen" id="menuScreen">
    <h1>⚡ BRAWL CLONE</h1>
    <p>Arena-Shooter im Brawl-Stars-Stil</p>
    <button onclick="showSelect()">SPIELEN</button>
</div>

<!-- BRAWLER SELECT -->
<div class="screen hidden" id="selectScreen">
    <h2>🎮 WÄHLE DEINEN BRAWLER</h2>
    <div id="brawlerGrid"></div>
    <button id="startBtn" onclick="startGame()">LOS GEHT'S!</button>
</div>

<!-- CANVAS -->
<canvas id="gameCanvas" width="700" height="500"></canvas>

<!-- HUD -->
<div id="hud" class="hidden">
    <div class="hud-left">
        <div class="bar-row"><span class="bar-label">❤️ HP</span><div class="bar-track"><div class="bar-fill" id="hp-fill"></div></div></div>
        <div class="bar-row"><span class="bar-label">🔵 Ammo</span><div class="bar-track"><div class="bar-fill" id="ammo-fill"></div></div></div>
        <div class="bar-row"><span class="bar-label">⚡ Super</span><div class="bar-track"><div class="bar-fill" id="super-fill"></div></div></div>
    </div>
    <div class="hud-right">
        <div id="hud-kills">Kills: 0</div>
        <div id="hud-wave">Welle 1</div>
        <div id="super-btn-hint">E = Super</div>
    </div>
</div>

<div id="controls-hint">WASD Bewegen · Maus Zielen · Klick Angriff · E Super</div>

<!-- GAME OVERLAY -->
<div id="overlay" class="hidden">
    <h1 id="overlay-title"></h1>
    <div class="sub" id="overlay-sub"></div>
    <div class="score" id="overlay-score"></div>
    <button onclick="showSelect()">BRAWLER WECHSELN</button>
    <button onclick="startGame()">NOCHMAL</button>
</div>

<script src="game.js"></script>
</body>
</html>
